<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheng's Daily Workbench · No API</title>
  <style>
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --text: #172033;
  --muted: #6b7485;
  --line: #e5e9ef;
  --accent: #315efb;
  --accent-soft: #edf1ff;
  --danger: #d64545;
  --success: #1b8a5a;
  --warning: #b7791f;
  --shadow: 0 10px 35px rgba(24, 32, 51, .07);
}

[data-theme="dark"] {
  --bg: #0f131a;
  --panel: #171c25;
  --panel-2: #1d2430;
  --text: #eef2f8;
  --muted: #9ba6b7;
  --line: #2a3342;
  --accent: #7c9cff;
  --accent-soft: #222c4d;
  --shadow: 0 10px 35px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background: var(--bg);
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 270px 1fr; }
.sidebar {
  position: sticky; top: 0; height: 100vh; padding: 24px 18px;
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 28px;
}
.brand-block { display: flex; gap: 12px; align-items: center; padding: 2px 8px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
  background: var(--text); color: var(--panel); font-weight: 800;
}
.brand-title { font-weight: 800; font-size: 16px; }
.brand-subtitle { margin-top: 3px; color: var(--muted); font-size: 11px; }
.nav { display: flex; flex-direction: column; gap: 6px; }
.nav-btn {
  width: 100%; border: 0; background: transparent; color: var(--muted);
  padding: 11px 12px; border-radius: 10px; text-align: left; display: flex; gap: 11px; align-items: center;
}
.nav-btn:hover { background: var(--panel-2); color: var(--text); }
.nav-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-icon { width: 22px; text-align: center; }
.sidebar-footer { margin-top: auto; display: grid; gap: 8px; }
.file-label { text-align: center; }

.main { min-width: 0; }
.topbar {
  padding: 32px 40px 20px; display: flex; justify-content: space-between; align-items: center;
}
.topbar h1 { margin: 4px 0 0; font-size: 30px; letter-spacing: -.03em; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .09em; text-transform: uppercase; }
.topbar-actions { display: flex; gap: 10px; }
.content { padding: 0 40px 48px; }

.primary-btn, .ghost-btn, .danger-ghost-btn, .icon-btn {
  border-radius: 10px; border: 1px solid var(--line); padding: 10px 14px; color: var(--text); background: var(--panel);
}
.primary-btn { background: var(--text); color: var(--panel); border-color: var(--text); font-weight: 700; }
.ghost-btn:hover, .icon-btn:hover { background: var(--panel-2); }
.danger-ghost-btn { color: var(--danger); }
.icon-btn { width: 42px; height: 42px; padding: 0; font-size: 18px; }

.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 14px; font-size: 16px; }
.card-header { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; }
.card-header h3 { margin: 0; }
.metric { font-size: 29px; font-weight: 800; letter-spacing: -.03em; }
.metric-label { color: var(--muted); font-size: 12px; margin-top: 5px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.task-list, .item-list { display: grid; gap: 10px; }
.task-row, .item-row {
  padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2);
  display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
}
.task-main { display: flex; gap: 10px; }
.task-title.done { text-decoration: line-through; color: var(--muted); }
.checkbox { accent-color: var(--accent); width: 17px; height: 17px; margin-top: 2px; }
.badge { padding: 4px 8px; border-radius: 999px; font-size: 11px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.high { background: #fff0f0; color: var(--danger); }
.badge.medium { background: #fff7e6; color: var(--warning); }
.badge.done { background: #e9f8f1; color: var(--success); }
.row-actions { display: flex; gap: 6px; }
.mini-btn { border: 0; background: transparent; color: var(--muted); padding: 2px 4px; }
.mini-btn:hover { color: var(--text); }

.progress-track { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); border-radius: inherit; }
.section-title { margin: 28px 0 14px; font-size: 18px; }
.empty { text-align: center; padding: 28px; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
.stars { letter-spacing: 3px; color: #d69e2e; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; vertical-align: top; }
th { color: var(--muted); font-weight: 600; }

#editDialog { width: min(620px, calc(100% - 24px)); border: 0; border-radius: 18px; padding: 0; background: transparent; }
#editDialog::backdrop { background: rgba(0,0,0,.45); backdrop-filter: blur(2px); }
.dialog-card { background: var(--panel); color: var(--text); padding: 22px; border-radius: 18px; border: 1px solid var(--line); }
.dialog-header, .dialog-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dialog-header h2 { margin: 4px 0 0; }
.dialog-actions { justify-content: flex-end; margin-top: 18px; }
.form-fields { display: grid; gap: 14px; margin-top: 18px; }
.field { display: grid; gap: 7px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel-2); color: var(--text); outline: none;
}
.field textarea { min-height: 90px; resize: vertical; }



.news-hero {
  background: linear-gradient(135deg, var(--panel) 0%, var(--accent-soft) 100%);
  overflow: hidden;
}
.news-hero-top { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
.news-status { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; font-size: 11px; background: var(--panel); border: 1px solid var(--line); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status-dot.ready { background: var(--success); }
.status-dot.loading { background: var(--warning); }
.status-dot.error { background: var(--danger); }
.news-summary { font-size: 16px; line-height: 1.75; margin: 18px 0 0; max-width: 980px; }
.brief-columns { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-top: 18px; }
.brief-box { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 13px; padding: 15px; }
.brief-box h4 { margin: 0 0 10px; font-size: 13px; }
.brief-list { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 13px; line-height: 1.55; }
.sector-block { min-width: 0; }
.sector-heading { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
.news-card { display: grid; gap: 9px; padding: 15px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel-2); }
.news-card + .news-card { margin-top: 10px; }
.news-card-title { font-size: 15px; font-weight: 750; line-height: 1.45; }
.news-card-meta { color: var(--muted); font-size: 11px; }
.news-card-summary { font-size: 13px; line-height: 1.65; }
.news-relevance { border-left: 3px solid var(--accent); padding-left: 10px; font-size: 12px; line-height: 1.55; }
.news-link { color: var(--accent); text-decoration: none; font-size: 12px; font-weight: 700; }
.news-link:hover { text-decoration: underline; }
.inline-actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
.notice { padding: 14px; border: 1px dashed var(--line); border-radius: 12px; background: var(--panel-2); font-size: 13px; line-height: 1.65; }


.ai-area { margin-top: 18px; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 18px; align-items: stretch; }
.ai-summary-card, .ai-chat-card { min-width: 0; }
.ai-title-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.ai-kicker { color: var(--accent); font-weight: 800; font-size: 11px; letter-spacing: .08em; }
.ai-updated { color: var(--muted); font-size: 11px; white-space: nowrap; }
.ai-summary-text { line-height: 1.75; white-space: pre-wrap; }
.ai-columns { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 14px; }
.ai-list-box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 13px; }
.ai-list-box h4 { margin: 0 0 9px; font-size: 12px; }
.ai-list-box ul { margin: 0; padding-left: 18px; display: grid; gap: 7px; font-size: 12px; line-height: 1.55; }
.ai-chat-log { height: 310px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px; scroll-behavior: smooth; }
.ai-message { max-width: 88%; padding: 10px 12px; border-radius: 13px; line-height: 1.6; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.ai-message.user { margin-left: auto; background: var(--text); color: var(--panel); border-bottom-right-radius: 4px; }
.ai-message.assistant { margin-right: auto; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.ai-composer { border-top: 1px solid var(--line); padding-top: 12px; }
.ai-composer textarea { width: 100%; min-height: 86px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel-2); color: var(--text); outline: none; }
.ai-composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ai-composer-actions { margin-top: 9px; display: flex; justify-content: space-between; gap: 9px; align-items: center; flex-wrap: wrap; }
.ai-hint { color: var(--muted); font-size: 11px; }
.ai-status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
.ai-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.ai-status-dot.connected { background: var(--success); }
.ai-status-dot.loading { background: var(--warning); animation: pulse 1s infinite; }
.ai-status-dot.error { background: var(--danger); }
@keyframes pulse { 50% { opacity: .35; } }
.ai-empty { color: var(--muted); font-size: 13px; line-height: 1.65; padding: 12px; background: var(--panel-2); border-radius: 12px; border: 1px dashed var(--line); }


.chatgpt-guide { display: grid; gap: 12px; }
.chatgpt-steps { margin: 0; padding-left: 20px; display: grid; gap: 9px; font-size: 13px; line-height: 1.6; }
.chatgpt-question { width: 100%; min-height: 112px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel-2); color: var(--text); outline: none; }
.chatgpt-question:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sync-note { padding: 11px 12px; border-radius: 11px; background: var(--accent-soft); color: var(--text); font-size: 12px; line-height: 1.65; }
.copy-feedback { color: var(--success); font-size: 12px; min-height: 18px; }
@media (max-width: 760px) {
  .topbar { align-items: flex-start; gap: 14px; }
  .topbar-actions { flex-wrap: wrap; justify-content: flex-end; }
  .primary-btn, .ghost-btn { padding: 10px 12px; }
}

@media (max-width: 980px) {
  .app-shell { grid-template-columns: 88px 1fr; }
  .brand-title, .brand-subtitle, .nav-label, .sidebar-footer { display: none; }
  .brand-block { justify-content: center; }
  .nav-btn { justify-content: center; }
  .grid-4, .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .brief-columns { grid-template-columns: 1fr; }
  .ai-area { grid-template-columns: 1fr; }
}

@media (max-width: 680px) {
  .app-shell { display: block; }
  .sidebar { position: static; width: 100%; height: auto; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand-block { justify-content: flex-start; }
  .brand-title, .brand-subtitle { display: block; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav-btn { width: auto; min-width: 48px; }
  .nav-label { display: none; }
  .topbar { padding: 22px 18px 16px; }
  .topbar h1 { font-size: 25px; }
  .content { padding: 0 18px 34px; }
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .ai-columns { grid-template-columns: 1fr; }
  .ai-chat-log { height: 260px; }
}

</style>
</head>

  <script>
const STORAGE_KEY = 'sheng_daily_workbench_v1';
const THEME_KEY = 'sheng_daily_workbench_theme';

const sections = [
  { id: 'dashboard', label: '今日总览', icon: '⌂' },
  { id: 'career', label: '职业发展', icon: '◎' },
  { id: 'news', label: '行业情报', icon: '◫' },
  { id: 'marketing', label: '营销工作区', icon: '◇' },
  { id: 'learning', label: '阅读与学习', icon: '▤' },
  { id: 'health', label: '健康与减脂', icon: '♡' },
  { id: 'life', label: '生活与运势', icon: '✦' },
  { id: 'insight', label: '个人复盘', icon: '◌' }
];

let state = loadState();
ensureStateShape();
let currentSection = 'dashboard';
let dialogConfig = null;
let autoNews = { status: 'loading', generatedAt: '', date: '', summary: '', keySignals: [], recommendedActions: [], items: [], error: '' };

function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
function ensureStateShape() {
  if (!state || typeof state !== 'object') state = clone(window.WORKBENCH_DATA);
  if (!state.ai || typeof state.ai !== 'object') state.ai = {};
  if (!state.ai.summaries || typeof state.ai.summaries !== 'object') state.ai.summaries = {};
  if (!state.ai.conversations || typeof state.ai.conversations !== 'object') state.ai.conversations = {};
  for (const section of sections) {
    if (!Array.isArray(state.ai.conversations[section.id])) state.ai.conversations[section.id] = [];
  }
}
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : clone(window.WORKBENCH_DATA);
  } catch {
    return clone(window.WORKBENCH_DATA);
  }
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) { console.warn('本地保存不可用：', err); } }
function uid(prefix='id') { return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`; }
function escapeHtml(v='') {
  return String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
}
function todayText() {
  return new Intl.DateTimeFormat('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' }).format(new Date());
}

function init() {
  document.getElementById('todayLabel').textContent = todayText();
  document.getElementById('nav').innerHTML = sections.map(s => `
    <button class="nav-btn ${s.id === currentSection ? 'active' : ''}" data-section="${s.id}">
      <span class="nav-icon">${s.icon}</span><span class="nav-label">${s.label}</span>
    </button>`).join('');

  document.getElementById('nav').addEventListener('click', e => {
    const btn = e.target.closest('[data-section]');
    if (!btn) return;
    currentSection = btn.dataset.section;
    document.querySelectorAll('.nav-btn').forEach(x => x.classList.toggle('active', x.dataset.section === currentSection));
    render();
  });

  document.getElementById('quickAddBtn').addEventListener('click', () => openAddTask());
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importInput').addEventListener('change', importData);
  document.getElementById('resetBtn').addEventListener('click', resetData);
  document.getElementById('editForm').addEventListener('submit', handleDialogSubmit);
  document.getElementById('closeDialogBtn').addEventListener('click', closeDialog);
  document.getElementById('cancelDialogBtn').addEventListener('click', closeDialog);
  document.getElementById('editDialog').addEventListener('cancel', e => { e.preventDefault(); closeDialog(); });
  document.getElementById('editDialog').addEventListener('click', e => { if (e.target === e.currentTarget) closeDialog(); });

  let savedTheme = 'light';
  try { savedTheme = localStorage.getItem(THEME_KEY) || 'light'; } catch (err) {}
  applyTheme(savedTheme);
  render();
  loadAutoNews();
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem(THEME_KEY, theme); } catch (err) { console.warn('主题保存不可用：', err); }
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}


function safeUrl(value='') {
  try {
    const url = new URL(value);
    return ['http:', 'https:'].includes(url.protocol) ? url.href : '#';
  } catch {
    return '#';
  }
}

function formatTimestamp(value='') {
  if (!value) return '尚未生成';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return value;
  return new Intl.DateTimeFormat('zh-CN', {
    month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
  }).format(d);
}

async function loadAutoNews(manual=false) {
  autoNews = { ...autoNews, status: 'loading', error: '' };
  if (manual || currentSection === 'news') render();
  try {
    const response = await fetch(`news-data.json?ts=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    autoNews = {
      status: 'ready',
      generatedAt: data.generatedAt || '',
      date: data.date || '',
      summary: data.summary || '',
      keySignals: Array.isArray(data.keySignals) ? data.keySignals : [],
      recommendedActions: Array.isArray(data.recommendedActions) ? data.recommendedActions : [],
      items: Array.isArray(data.items) ? data.items : [],
      error: ''
    };
  } catch (error) {
    autoNews = {
      ...autoNews,
      status: location.protocol === 'file:' ? 'local' : 'error',
      error: error?.message || '无法读取行业情报文件'
    };
  }
  if (currentSection === 'news' || currentSection === 'dashboard') render();
}

function render() {
  const title = sections.find(s => s.id === currentSection)?.label || '工作台';
  document.getElementById('pageTitle').textContent = title;

    dashboard: renderDashboard,

    news: renderNews,
    marketing: renderMarketing,
    learning: renderLearning,
    health: renderHealth,
    life: renderLife,
    insight: renderInsight
  };
  document.getElementById('content').innerHTML = `${map[currentSection]()}${renderAiWorkspace(currentSection)}`;
  bindDynamicEvents();
}

function metricCard(value,label) { return `<div class="card"><div class="metric">${escapeHtml(value)}</div><div class="metric-label">${escapeHtml(label)}</div></div>`; }
function stars(n) { return '★'.repeat(n) + '☆'.repeat(5-n); }
function progressBlock(value,label) { const v=Math.max(0,Math.min(100,Number(value)||0)); return `<div><div class="progress-track"><div class="progress-bar" style="width:${v}%"></div></div>${label?`<div class="small muted" style="margin-top:7px">${escapeHtml(label)} · ${v}%</div>`:''}</div>`; }
function averageBookProgress() { return state.books.length ? Math.round(state.books.reduce((s,b)=>s+(Number(b.progress)||0),0)/state.books.length) : 0; }
function latestWeight() { return state.health.weightLogs.length ? state.health.weightLogs[state.health.weightLogs.length-1].weight : state.profile.currentWeight; }
function weightProgress() {
  const start = state.profile.currentWeight, target = state.profile.targetWeight, current = latestWeight();
  return Math.round(((start-current)/(start-target))*100);
}
function rowButtons(type,id) { return `<div class="row-actions"><button class="mini-btn" data-action="edit" data-type="${type}" data-id="${id}">编辑</button><button class="mini-btn" data-action="delete" data-type="${type}" data-id="${id}">删除</button></div>`; }
function taskList(tasks) {
  if (!tasks.length) return '<div class="empty">今天的任务都完成了</div>';
  return `<div class="task-list">${tasks.map(t=>`<div class="task-row"><div class="task-main"><input class="checkbox" type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done?'checked':''}><div><div class="task-title ${t.done?'done':''}">${escapeHtml(t.title)}</div><div class="small muted">${escapeHtml(t.due)} · ${escapeHtml(t.category)}</div></div></div><span class="badge ${t.priority}">${escapeHtml(t.priority)}</span></div>`).join('')}</div>`;
}

function bindDynamicEvents() {
  document.getElementById('content').onclick = e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    if (action === 'add-task') return openAddTask();
    if (action === 'add-application') return openApplication();
    if (action === 'add-news') return openNews();
    if (action === 'reload-news') return loadAutoNews(true);
    if (action === 'add-project') return openProject();
    if (action === 'add-book') return openBook();
    if (action === 'add-learning') return openLearning();
    if (action === 'add-meal') return openMeal();
    if (action === 'add-weight') return openWeight();
    if (action === 'edit-fortune') return openFortune();
    if (action === 'add-life-note') return openLifeNote();
    if (action === 'add-insight') return openInsight();
    if (action === 'chatgpt-copy') return copySectionPrompt();
    if (action === 'chatgpt-open') return openChatGPT();
    if (action === 'chatgpt-import') return openImportChatGptResult();
    if (action === 'chatgpt-clear') return clearSectionSummary();
    if (action === 'delete') return deleteItem(el.dataset.type, el.dataset.id);
    if (action === 'edit') return editItem(el.dataset.type, el.dataset.id);
  };
  document.querySelectorAll('[data-action="toggle-task"]').forEach(cb => cb.onchange = () => {
    const t = state.tasks.find(x=>x.id===cb.dataset.id); if(t){t.done=cb.checked;saveState();render();}
  });
}

        </div>
        <div class="chatgpt-guide">
          <div class="sync-note">网页会把当前板块的数据与分析要求整理成提示词。你在 ChatGPT 沟通完成后，把最终结果粘贴回来，左侧会自动更新。</div>
          <ol class="chatgpt-steps">
            <li>可在下面补充本次问题或新增信息。</li>
            <li>点击“复制提示词”，再打开 ChatGPT 粘贴并继续沟通。</li>
            <li>让 ChatGPT 最终按提示词中的 JSON 格式输出。</li>
            <li>点击“导入结果”，粘贴完整结果并保存。</li>
          </ol>
          <textarea id="chatgptQuestion" class="chatgpt-question" placeholder="可选：例如‘比较这三个岗位的匹配度，并给出未来三天行动计划’；不填写也可以直接复制。"></textarea>
          <div id="copyFeedback" class="copy-feedback"></div>
          <div class="inline-actions" style="justify-content:flex-start">
            <button class="primary-btn" data-action="chatgpt-copy">复制提示词</button>
            <button class="ghost-btn" data-action="chatgpt-open">打开 ChatGPT ↗</button>
            <button class="ghost-btn" data-action="chatgpt-import">导入 ChatGPT 结果</button>
            <button class="danger-ghost-btn" data-action="chatgpt-clear" ${summary.updatedAt ? '' : 'disabled'}>清除总结</button>
          </div>
        </div>
      </div>
    </section>`;
}

function getSectionContext(section) {
  const contextMap = {
    dashboard: {
      tasks: state.tasks,
      applications: state.applications,
      learning: state.learning,
      books: state.books,
      health: state.health,
      industryBrief: { summary: autoNews.summary, keySignals: autoNews.keySignals, recommendedActions: autoNews.recommendedActions }
    },
    career: { profile: state.profile, applications: state.applications, tasks: state.tasks.filter(t=>t.category==='career') },
    news: { automaticBrief: autoNews, savedNews: state.news },
    marketing: { projects: state.projects, tasks: state.tasks.filter(t=>t.category==='marketing') },
    learning: { books: state.books, learning: state.learning, tasks: state.tasks.filter(t=>t.category==='learning') },
    health: { profile: state.profile, health: state.health, tasks: state.tasks.filter(t=>t.category==='health') },
    life: { life: state.life, tasks: state.tasks.filter(t=>t.category==='life') },
    insight: { insights: state.insights, existingSummaries: state.ai.summaries }
  };
  return contextMap[section] || {};
}

function buildSectionPrompt(section) {
  const meta = aiSectionMeta[section] || aiSectionMeta.dashboard;
  const question = (document.getElementById('chatgptQuestion')?.value || '').trim();
  const context = getSectionContext(section);
  return `你正在协助我维护个人工作台中的【${meta.title}】板块。\n\n核心任务：\n${meta.prompt}\n\n${question ? `我本次特别想讨论：\n${question}\n\n` : ''}当前工作台数据：\n${JSON.stringify(context, null, 2)}\n\n请先正常分析并与我沟通；当我确认需要写回工作台时，请只输出一个 JSON 对象，不要添加 Markdown 代码框、开场白或解释。格式必须为：\n{\n  "summary": "一段清晰、可长期保存的板块总结",\n  "keyPoints": ["关键信息1", "关键信息2", "关键信息3"],\n  "nextActions": ["具体行动1", "具体行动2", "具体行动3"]\n}\n\n要求：\n1. summary 使用中文，简洁但有判断；\n2. keyPoints 和 nextActions 各 2—6 项；\n3. 不虚构工作台中不存在的数据；\n4. 健康内容仅作一般性信息整理，不替代医疗建议；\n5. 运势内容仅作娱乐与自我反思。`;
}

async function copySectionPrompt() {
  const text = buildSectionPrompt(currentSection);
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (error) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    ok = document.execCommand('copy');
    textarea.remove();
  }
  const feedback = document.getElementById('copyFeedback');
  if (feedback) feedback.textContent = ok ? '提示词已复制。现在打开 ChatGPT 并粘贴即可。' : '复制失败，请更换浏览器后重试。';
}

function openChatGPT() {
  window.open('https://chatgpt.com/', '_blank', 'noopener,noreferrer');
}

function openImportChatGptResult() {
  openDialog('导入 ChatGPT 整理结果', [
    { name: 'result', label: '粘贴 ChatGPT 最终输出', type: 'textarea', required: true, placeholder: '{"summary":"...","keyPoints":["..."],"nextActions":["..."]}' }
  ], data => {
    const parsed = parseChatGptResult(data.result || '');
    state.ai.summaries[currentSection] = {
      summary: parsed.summary,
      keyPoints: parsed.keyPoints.slice(0, 6),
      nextActions: parsed.nextActions.slice(0, 6),
      rawResult: String(data.result || ''),
      updatedAt: new Date().toISOString()
    };
  });
}

function parseChatGptResult(raw) {
  const text = String(raw || '').trim();
  if (!text) throw new Error('没有可导入的内容');
  let candidate = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
  const firstBrace = candidate.indexOf('{');
  const lastBrace = candidate.lastIndexOf('}');
  if (firstBrace >= 0 && lastBrace > firstBrace) candidate = candidate.slice(firstBrace, lastBrace + 1);
  try {
    const obj = JSON.parse(candidate);
    const summary = String(obj.summary || '').trim();
    const keyPoints = Array.isArray(obj.keyPoints) ? obj.keyPoints.map(String).map(x=>x.trim()).filter(Boolean) : [];
    const nextActions = Array.isArray(obj.nextActions) ? obj.nextActions.map(String).map(x=>x.trim()).filter(Boolean) : [];
    if (summary) return { summary, keyPoints, nextActions };
  } catch (error) {}

  const normalized = text.replace(/\r/g, '');
  const summaryMatch = normalized.match(/(?:【|#+\s*)?(?:板块总结|总结|summary)(?:】)?\s*[:：]?\s*([\s\S]*?)(?=\n\s*(?:【|#+\s*)?(?:关键信息|关键点|keyPoints|下一步|nextActions)(?:】)?\s*[:：]?|$)/i);
  const keyMatch = normalized.match(/(?:【|#+\s*)?(?:关键信息|关键点|keyPoints)(?:】)?\s*[:：]?\s*([\s\S]*?)(?=\n\s*(?:【|#+\s*)?(?:下一步|行动建议|nextActions)(?:】)?\s*[:：]?|$)/i);
  const actionMatch = normalized.match(/(?:【|#+\s*)?(?:下一步|行动建议|nextActions)(?:】)?\s*[:：]?\s*([\s\S]*)$/i);
  const toList = block => String(block || '').split('\n').map(x=>x.replace(/^\s*[-*•\d.、)]+\s*/, '').trim()).filter(Boolean);
  const summary = (summaryMatch?.[1] || text).trim();
  return { summary, keyPoints: toList(keyMatch?.[1]), nextActions: toList(actionMatch?.[1]) };
}

function clearSectionSummary() {
  if (!confirm('确认清除当前板块的 ChatGPT 整理结果？原始记录不会受影响。')) return;
  delete state.ai.summaries[currentSection];
  saveState();
  render();
}

function openDialog(title, fields, onSave, initial={}) {
  dialogConfig = { fields, onSave, initial };
  document.getElementById('dialogTitle').textContent = title;
  document.getElementById('formFields').innerHTML = fields.map(f => fieldHtml(f, initial[f.name])).join('');
  document.getElementById('editDialog').showModal();
}
function fieldHtml(f, value='') {
  const label = `<label for="fld_${f.name}">${escapeHtml(f.label)}</label>`;
  if (f.type === 'textarea') return `<div class="field">${label}<textarea id="fld_${f.name}" name="${f.name}" ${f.required?'required':''}>${escapeHtml(value)}</textarea></div>`;
  if (f.type === 'select') return `<div class="field">${label}<select id="fld_${f.name}" name="${f.name}">${f.options.map(o=>`<option ${o===value?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select></div>`;
  return `<div class="field">${label}<input id="fld_${f.name}" name="${f.name}" type="${f.type||'text'}" value="${escapeHtml(value)}" placeholder="${escapeHtml(f.placeholder||'')}" ${f.required?'required':''}></div>`;
}
function closeDialog() {
  dialogConfig = null;
  const dialog = document.getElementById('editDialog');
  if (dialog.open) dialog.close();
  document.getElementById('editForm').reset();
}
function handleDialogSubmit(e) {
  e.preventDefault();
  if (!dialogConfig) return;
  const data = Object.fromEntries(new FormData(e.target).entries());
  try {
    dialogConfig.onSave(data);
    saveState();
    closeDialog();
    render();
  } catch (error) {
    alert(error?.message || '保存失败，请检查填写内容。');
  }
}

function openAddTask(initial={}, existingId=null) { openDialog(existingId?'编辑任务':'添加任务', [
  {name:'title',label:'任务',required:true},{name:'category',label:'分类',type:'select',options:['career','news','marketing','learning','health','life']},{name:'priority',label:'优先级',type:'select',options:['high','medium','low']},{name:'due',label:'截止时间'}
], d => { const obj={id:existingId||uid('t'),...d,done:initial.done||false}; upsert(state.tasks,obj); }, initial); }
function openApplication(initial={}, id=null){ openDialog(id?'编辑岗位':'新增岗位',[{name:'company',label:'公司',required:true},{name:'role',label:'岗位',required:true},{name:'stage',label:'阶段',type:'select',options:['待投递','已投递','笔试','面试','Offer','拒绝']},{name:'date',label:'日期',type:'date'},{name:'note',label:'备注',type:'textarea'}],d=>upsert(state.applications,{id:id||uid('a'),...d}),initial); }
function openNews(initial={},id=null){ openDialog(id?'编辑新闻':'添加新闻',[{name:'sector',label:'赛道',type:'select',options:['个护美妆快消','电商','运动服饰','品牌出海']},{name:'title',label:'标题',required:true},{name:'source',label:'来源'},{name:'date',label:'日期',type:'date'},{name:'takeaway',label:'核心启发',type:'textarea'}],d=>upsert(state.news,{id:id||uid('n'),...d}),initial); }
function openProject(initial={},id=null){ openDialog(id?'编辑项目':'新增项目',[{name:'name',label:'项目名称',required:true},{name:'type',label:'类型',type:'select',options:['Brand Campaign','E-commerce','Digital Marketing','Overseas Marketing']},{name:'status',label:'状态',type:'select',options:['计划中','进行中','待复盘','已完成']},{name:'objective',label:'项目目标',type:'textarea'},{name:'metric',label:'关键指标'},{name:'next',label:'下一步',type:'textarea'}],d=>upsert(state.projects,{id:id||uid('p'),...d}),initial); }
function openBook(initial={},id=null){ openDialog(id?'编辑书籍':'添加书籍',[{name:'title',label:'书名',required:true},{name:'author',label:'作者'},{name:'progress',label:'阅读进度（0-100）',type:'number'},{name:'currentChapter',label:'当前章节'},{name:'summary',label:'核心总结',type:'textarea'}],d=>upsert(state.books,{id:id||uid('b'),...d,progress:Number(d.progress)||0}),initial); }
function openLearning(initial={},id=null){ openDialog(id?'编辑学习主题':'添加学习主题',[{name:'topic',label:'主题',required:true},{name:'type',label:'分类',type:'select',options:['Digital Marketing','E-commerce','Data Analysis','Overseas Marketing','AI Tools']},{name:'status',label:'状态',type:'select',options:['待学习','学习中','已完成']},{name:'note',label:'笔记',type:'textarea'}],d=>upsert(state.learning,{id:id||uid('l'),...d}),initial); }
function openMeal(initial={},id=null){ openDialog(id?'编辑饮食':'记录饮食',[{name:'name',label:'食物',required:true},{name:'type',label:'餐次',type:'select',options:['早餐','午餐','晚餐','零食']},{name:'calories',label:'热量 kcal',type:'number'},{name:'protein',label:'蛋白质 g',type:'number'}],d=>{const obj={id:id||uid('m'),...d,calories:Number(d.calories)||0,protein:Number(d.protein)||0};upsert(state.health.meals,obj);recalcNutrition();},initial); }
function openWeight(){ openDialog('记录体重',[{name:'date',label:'日期',type:'date',required:true},{name:'weight',label:'体重 kg',type:'number',required:true}],d=>state.health.weightLogs.push({date:d.date,weight:Number(d.weight)}),{date:new Date().toISOString().slice(0,10)}); }
function openFortune(){ const f=state.life.fortune;openDialog('编辑今日运势',[{name:'career',label:'职业（1-5）',type:'number'},{name:'health',label:'健康（1-5）',type:'number'},{name:'social',label:'社交（1-5）',type:'number'},{name:'message',label:'今日提醒',type:'textarea'}],d=>state.life.fortune={career:clampStar(d.career),health:clampStar(d.health),social:clampStar(d.social),message:d.message},f); }
function openLifeNote(initial={},id=null){ openDialog(id?'编辑备忘':'添加生活备忘',[{name:'title',label:'标题',required:true},{name:'content',label:'内容',type:'textarea'}],d=>upsert(state.life.notes,{id:id||uid('life'),...d}),initial); }
function openInsight(initial={},id=null){ openDialog(id?'编辑复盘':'新增复盘',[{name:'date',label:'日期',type:'date'},{name:'question',label:'复盘问题',required:true},{name:'answer',label:'回答',type:'textarea'}],d=>upsert(state.insights,{id:id||uid('i'),...d}),initial.date?initial:{date:new Date().toISOString().slice(0,10),...initial}); }

function clampStar(v){return Math.max(1,Math.min(5,Number(v)||3));}
function upsert(arr,obj){const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);}
function recalcNutrition(){state.health.caloriesToday=state.health.meals.reduce((s,m)=>s+m.calories,0);state.health.proteinToday=state.health.meals.reduce((s,m)=>s+m.protein,0);}

function editItem(type,id){
  const map={application:[state.applications,openApplication],news:[state.news,openNews],project:[state.projects,openProject],book:[state.books,openBook],learning:[state.learning,openLearning],meal:[state.health.meals,openMeal],'life-note':[state.life.notes,openLifeNote],insight:[state.insights,openInsight]};
  const pair=map[type]; if(!pair)return; const item=pair[0].find(x=>x.id===id); if(item)pair[1](item,id);
}
function deleteItem(type,id){
  if(!confirm('确认删除这条记录？'))return;
  const map={application:state.applications,news:state.news,project:state.projects,book:state.books,learning:state.learning,meal:state.health.meals,'life-note':state.life.notes,insight:state.insights};
  const arr=map[type]; if(!arr)return; const i=arr.findIndex(x=>x.id===id); if(i>=0)arr.splice(i,1); if(type==='meal')recalcNutrition(); saveState();render();
}

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`workbench-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{state=JSON.parse(reader.result);ensureStateShape();saveState();render();alert('导入成功');}catch{alert('文件格式不正确');}};reader.readAsText(file);e.target.value='';
}
function resetData(){if(confirm('将清除浏览器中的修改并恢复工作台初始数据，是否继续？')){state=clone(window.WORKBENCH_DATA);ensureStateShape();saveState();render();}}

init();

</script>
